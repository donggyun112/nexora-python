# The workspace root. It builds nothing: every distribution lives under `packages/`, including the
# core. `semora` is one member among them.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "semora",
  "semora-store-pg",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
  "pydantic-ai-harness>=0.29.0",
]

[tool.uv.sources]
semora = { workspace = true }
semora-store = { workspace = true }
semora-store-pg = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"examples/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests", "packages"]
plugins = ["pydantic.mypy"]
