[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora-ui"
version = "0.1.0"
description = "A local console for driving Nexora runs: chat, tool effects, suspension and resume."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "nexora",
  "fastapi>=0.116,<1",
  "langchain-openai>=0.3,<2",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]
# A demo application, not a library. It is the one package allowed to depend on everything.

[tool.uv.sources]
nexora = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_ui"]
