[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora-engines"
version = "0.1.0"
description = "Nexora planners. One engine: the plain async while loop (ADR-005)."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "nexora-contracts",
  "nexora-orchestrator",
]
# Depends on the orchestrator for tool-round execution, not only on contracts — the loop
# discovers the position and the orchestrator owns everything in between.

[tool.uv.sources]
nexora-contracts = { workspace = true }
nexora-orchestrator = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_engines"]
