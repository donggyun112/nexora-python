[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semora-permissions"
version = "0.1.0"
description = "A Claude-Code-shaped permission rule table as pre_tool_use / on_resume stages."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
urls = { Homepage = "https://github.com/donggyun112/semora", Source = "https://github.com/donggyun112/semora", Changelog = "https://github.com/donggyun112/semora/blob/main/CHANGELOG.md" }
dependencies = [
  "semora==0.1.0",
]
# Optional by construction: nothing in the runtime imports this. A host that wants the
# rule table installs it; a host with its own policy never sees it.

[tool.uv.sources]
semora = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/semora_permissions"]
