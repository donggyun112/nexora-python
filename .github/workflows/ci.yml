name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release calls this instead of restating the checks; a tag publishes only what CI passed.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Without a database the store conformance suite skips its durable half, and a skip is not a
    # pass: every divergence that file was written to catch was a method both stores had, doing
    # different things. The health check is what makes a wait step unnecessary.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: semora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      # The `glob` builtin requires ripgrep rather than falling back, so without it on PATH its
      # test skips and the runner reports a pass for a dependency it never exercised.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Test
        env:
          SEMORA_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/semora_test
        run: uv run pytest

