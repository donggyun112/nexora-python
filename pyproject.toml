# The workspace root. It builds nothing: every distribution lives under `packages/`, including the
# core, because none of them is the product the others orbit. `nexora` is one member among them.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  # The extras, so a plain `uv sync` gives an environment the checks can actually run in: without
  # them mypy reports every FastAPI decorator as untyped and the Postgres store test skips — a
  # green run that verified less than it looked like it did.
  "nexora[fork,permissions,postgres,ui]",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.uv.sources]
nexora = { workspace = true }
nexora-fork = { workspace = true }
nexora-llm = { workspace = true }
nexora-permissions = { workspace = true }
nexora-store = { workspace = true }
nexora-store-pg = { workspace = true }
nexora-ui = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "perf: timing-sensitive properties (concurrency, scaling). Deselect with -m 'not perf'.",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"examples/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"issue_drafts/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests", "packages"]
plugins = ["pydantic.mypy"]
