[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora-store"
version = "0.1.0"
description = "Storage-semantic contracts for Nexora execution and append-only transcripts."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []
# Deliberately empty, and the reason this is its own distribution. Storage adapters implement
# behavior contracts over opaque values, so they need no message type, control point, or physical
# schema from `nexora`. Anything appearing here means the boundary moved.

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_store"]
