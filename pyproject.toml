[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora"
version = "0.1.0"
description = "Durable multi-agent runtime for Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "loguru>=0.7,<1",
  "psycopg[binary,pool]>=3.3,<4",
]

[project.optional-dependencies]
# The alternate engine. Kept out of the core so `nexora` itself never depends on a
# framework's loop — see docs/architecture/adrs/adr-001.
langgraph = [
  "langchain>=1,<2",
  "langchain-openai>=0.3,<1",
  "langgraph>=1.2,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "perf: timing-sensitive properties (concurrency, scaling). Deselect with -m 'not perf'.",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

