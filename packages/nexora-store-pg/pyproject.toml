[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora-store-pg"
version = "0.1.0"
description = "PostgreSQL adapters for Nexora storage-semantic contracts."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "nexora-store",
  "psycopg[binary,pool]>=3.3,<4",
]
# Not `nexora`. This implements the ledger protocol and nothing above it, which is what keeps a
# database driver out of the default install.

[tool.uv.sources]
nexora-store = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_store_pg"]
