[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora-store"
version = "0.1.0"
description = "Nexora's step ledger: durable intent, ambiguity detection, exclusive execution."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []
# Deliberately empty, and the reason this is its own distribution. A `StepLog` stores opaque
# values under opaque keys, so an implementation needs no message type, no control point and
# nothing from `nexora`. Anything appearing here means the boundary moved.

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_store"]
