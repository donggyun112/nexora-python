name: Release

# A tag is the release trigger, and the tag must name the version already in the manifests:
# `v0.1.0` publishes the 0.1.0 built from that commit. PyPI accepts a filename once, so a
# botched upload is a version bump, never a re-push.
on:
  push:
    tags: ["v*"]
  # PyPI rate-limits *new project* creation, so a first release of several distributions can
  # stop half-done. Re-running the tag's workflow would rebuild the same commit; this lets the
  # rest go up without moving the tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same suite `main` runs. Publishing is irreversible, so it happens downstream of a pass
  # rather than beside one.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest

    # Not decoration: `PYPI_API_TOKEN` is scoped to this environment, so it is readable only by
    # a job that declares it. A workflow added later — or one a pull request can reach — cannot
    # see the token by default. Add a required reviewer here to gate a release on a human.
    environment: pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # All seven at once. One token covers the account, so unlike Trusted Publishing there is
      # no per-project exchange to split the build across.
      - name: Build every distribution
        run: uv build --all-packages

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A PyPI filename is immutable, so re-uploading one is an error rather than a no-op.
          # Without this, a run that finished half the distributions can never finish the rest.
          skip-existing: true
