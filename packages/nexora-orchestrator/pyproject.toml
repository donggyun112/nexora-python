[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora-orchestrator"
version = "0.1.0"
description = "Nexora's durable execution boundary: tool rounds, suspension, and recovery over a StepLog."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "nexora-contracts",
  "nexora-store",
]
# Tool execution and the suspension/resume codec live here too: they are the parts that
# read a transcript, and the orchestrator is their only consumer.

[tool.uv.sources]
nexora-contracts = { workspace = true }
nexora-store = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_orchestrator"]
