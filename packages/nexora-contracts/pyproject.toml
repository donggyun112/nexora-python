[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora-contracts"
version = "0.1.0"
description = "What every Nexora layer agrees on: message types, the event vocabulary, and the control points."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=1,<2",
  "loguru>=0.7,<1",
]
# The hub. It owns no behaviour — types, the event envelope, and the awaited control
# points with their composition rules. langchain-core is here because the message types
# are borrowed rather than redefined (ADR-005).

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_contracts"]
