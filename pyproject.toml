[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora"
version = "0.1.0"
description = "Durable multi-agent runtime for Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=1,<2",
  "nexora-contracts",
  "nexora-engines",
  "nexora-orchestrator",
]
# The facade. It owns runtime.py and driver.py and re-exports the entry points, so
# `from nexora import AgentRuntime` keeps meaning what it always did.

[project.optional-dependencies]
postgres = ["nexora-store-pg"]
permissions = ["nexora-permissions"]
ui = ["nexora-ui"]

[dependency-groups]
dev = [
  # The extras, so a plain `uv sync` gives an environment the checks can actually run in: without
  # them mypy reports every FastAPI decorator as untyped and the Postgres store test skips — a
  # green run that verified less than it looked like it did.
  "nexora[permissions,postgres,ui]",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexora"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nexora-contracts = { workspace = true }
nexora-engines = { workspace = true }
nexora-orchestrator = { workspace = true }
nexora-permissions = { workspace = true }
nexora-store = { workspace = true }
nexora-store-pg = { workspace = true }
nexora-ui = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "perf: timing-sensitive properties (concurrency, scaling). Deselect with -m 'not perf'.",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "packages"]
