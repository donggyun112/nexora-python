[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semora"
version = "0.3.3"
description = "Durable execution controls, approval revalidation and effect recovery for Pydantic AI agents."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pydantic-ai-slim>=2.38,<3",
  "semora-store==0.3.3",
]

[project.optional-dependencies]
postgres = ["semora-store-pg==0.3.3"]
openai = ["pydantic-ai-slim[openai]>=2.38,<3"]

[project.urls]
Homepage = "https://github.com/donggyun112/semora"
Source = "https://github.com/donggyun112/semora"
Changelog = "https://github.com/donggyun112/semora/blob/main/CHANGELOG.md"

[tool.uv.sources]
semora-store = { workspace = true }
semora-store-pg = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/semora"]
