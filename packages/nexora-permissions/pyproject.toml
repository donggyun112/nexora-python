[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexora-permissions"
version = "0.1.0"
description = "A Claude-Code-shaped permission rule table as pre_tool_use / on_resume stages."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "donggyun112" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "nexora-contracts",
]
# Optional by construction: nothing in the runtime imports this. A host that wants the
# rule table installs it; a host with its own policy never sees it.

[tool.uv.sources]
nexora-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nexora_permissions"]
